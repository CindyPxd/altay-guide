<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Zhou Keke Soft Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="dolphinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Aura Circle -->
  <circle cx="150" cy="150" r="130" fill="url(#bgGlow)" filter="url(#softShadow)"/>
  
  <!-- Outer Music Notes Floating -->
  <g fill="#0284c7" opacity="0.8">
    <!-- Note 1 -->
    <path d="M 40 80 C 40 70 55 65 60 75 C 60 90 40 95 40 80 Z"/>
    <rect x="56" y="55" width="4" height="25" rx="2"/>
    <path d="M 56 55 Q 70 50 75 60" stroke="#0284c7" stroke-width="3" fill="none"/>

    <!-- Note 2 -->
    <path d="M 240 70 C 240 60 255 55 260 65 C 260 80 240 85 240 70 Z"/>
    <rect x="256" y="45" width="4" height="25" rx="2"/>
  </g>

  <!-- Cute Blue Dolphin Swimming Overhead -->
  <g filter="url(#softShadow)">
    <path d="M 190 60 C 220 40 260 65 245 85 C 235 95 210 90 195 75 Z" fill="url(#dolphinGrad)"/>
    <path d="M 245 85 Q 265 95 260 80" fill="url(#dolphinGrad)"/>
    <circle cx="210" cy="62" r="3" fill="#ffffff"/>
    <circle cx="210" cy="62" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Zhou Keke Hood & Cape Body -->
  <g filter="url(#softShadow)">
    <!-- Hood Backing -->
    <path d="M 75 140 C 60 220 240 220 225 140 C 225 80 75 80 75 140 Z" fill="url(#hoodGrad)"/>
    
    <!-- Cute Animal Ears on Hood -->
    <path d="M 85 95 C 65 65 95 60 110 80 Z" fill="url(#hoodGrad)"/>
    <path d="M 215 95 C 235 65 205 60 190 80 Z" fill="url(#hoodGrad)"/>
    <path d="M 90 90 C 78 72 96 68 106 82 Z" fill="#e0f2fe" opacity="0.6"/>
    <path d="M 210 90 C 222 72 204 68 194 82 Z" fill="#e0f2fe" opacity="0.6"/>

    <!-- Face Oval -->
    <ellipse cx="150" cy="150" rx="55" ry="48" fill="#fff5eb"/>

    <!-- Hair Bangs -->
    <path d="M 98 135 C 105 110 120 105 130 118 C 140 102 155 102 165 118 C 175 105 190 110 202 135 C 190 122 170 125 150 128 C 130 125 110 122 98 135 Z" fill="url(#hairGrad)"/>
    
    <!-- Star Hairpin -->
    <path d="M 112 110 L 115 117 L 122 117 L 116 121 L 118 128 L 112 124 L 106 128 L 108 121 L 102 117 L 109 117 Z" fill="url(#starGrad)"/>

    <!-- Cute Eyes -->
    <!-- Left Eye -->
    <ellipse cx="130" cy="152" rx="7" ry="10" fill="#0c4a6e"/>
    <circle cx="128" cy="148" r="3" fill="#ffffff"/>
    <circle cx="132" cy="155" r="1.5" fill="#ffffff"/>

    <!-- Right Eye (Happy Blink / Sparkle) -->
    <ellipse cx="170" cy="152" rx="7" ry="10" fill="#0c4a6e"/>
    <circle cx="168" cy="148" r="3" fill="#ffffff"/>
    <circle cx="172" cy="155" r="1.5" fill="#ffffff"/>

    <!-- Cheeks (Blush) -->
    <ellipse cx="118" cy="162" rx="8" ry="4" fill="#f472b6" opacity="0.5"/>
    <ellipse cx="182" cy="162" rx="8" ry="4" fill="#f472b6" opacity="0.5"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 143 164 Q 150 172 157 164" stroke="#0369a1" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Body / Clothes (Cute Overalls with Music Note Patch) -->
    <path d="M 110 190 Q 150 205 190 190 L 205 250 Q 150 265 95 250 Z" fill="#0284c7"/>
    <path d="M 125 195 L 175 195 L 170 235 L 130 235 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Star Badge on Chest -->
    <path d="M 150 205 L 152 211 L 158 211 L 153 214 L 155 220 L 150 216 L 145 220 L 147 214 L 142 211 L 148 211 Z" fill="url(#starGrad)"/>

    <!-- Cute Hands Cheering -->
    <circle cx="92" cy="210" r="12" fill="#fff5eb"/>
    <circle cx="208" cy="210" r="12" fill="#fff5eb"/>
  </g>

  <!-- Sparkling Stars Around Mascot -->
  <g fill="url(#starGrad)">
    <!-- Star 1 -->
    <path d="M 50 160 L 53 167 L 60 167 L 55 171 L 57 178 L 50 174 L 43 178 L 45 171 L 40 167 L 47 167 Z"/>
    <!-- Star 2 -->
    <path d="M 240 150 L 242 155 L 247 155 L 243 158 L 245 163 L 240 160 L 235 163 L 237 158 L 233 155 L 238 155 Z"/>
    <!-- Star 3 -->
    <path d="M 150 30 L 152 35 L 157 35 L 153 38 L 155 43 L 150 40 L 145 43 L 147 38 L 143 35 L 148 35 Z"/>
  </g>
</svg>
