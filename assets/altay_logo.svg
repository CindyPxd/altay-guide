<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Emblem Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.85"/>
  <circle cx="60" cy="60" r="48" fill="#fffcf7" stroke="url(#goldGrad)" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Background Sun/Moon -->
  <circle cx="60" cy="42" r="16" fill="#fef3c7" opacity="0.9"/>
  <circle cx="60" cy="42" r="12" fill="url(#goldGrad)" opacity="0.2"/>

  <!-- Altay Mountain Peaks -->
  <!-- Back Mountain -->
  <polygon points="28,75 52,40 76,75" fill="#fcd34d" opacity="0.7"/>
  <!-- Front Main Mountain -->
  <polygon points="38,82 60,46 82,82" fill="url(#goldGrad)"/>
  <!-- Snow Cap -->
  <polygon points="60,46 54,56 58,54 60,58 64,53 66,56" fill="#ffffff"/>

  <!-- Birch Trees Silhouette -->
  <polygon points="26,82 30,70 34,82" fill="url(#greenGrad)"/>
  <polygon points="86,82 90,68 94,82" fill="url(#greenGrad)"/>
  <polygon points="20,82 24,73 28,82" fill="#15803d" opacity="0.8"/>

  <!-- Golden Autumn Birch Leaves / Stars -->
  <path d="M 60 22 L 62 26 L 66 26 L 63 29 L 64 33 L 60 30 L 56 33 L 57 29 L 54 26 L 58 26 Z" fill="url(#goldGrad)"/>
  <circle cx="36" cy="32" r="2.5" fill="#f59e0b"/>
  <circle cx="84" cy="32" r="2.5" fill="#f59e0b"/>

  <!-- Base Ribbon Banner / Journey Text Accent -->
  <path d="M 28 82 Q 60 88 92 82 L 88 92 Q 60 98 32 92 Z" fill="url(#goldGrad)"/>
  <text x="60" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ALTAI 2026</text>
</svg>
