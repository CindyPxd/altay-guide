<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <filter id="croissantShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#d97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hollow / Outline Croissant Vector (镂空线稿牛角包) -->
  <g filter="url(#croissantShadow)">
    <!-- Outer Crescent Outline -->
    <path d="M 16 55 C 10 32, 28 16, 50 16 C 72 16, 90 32, 84 55 C 78 74, 58 84, 50 84 C 42 84, 22 74, 16 55 Z" 
          fill="none" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pastry Folds (Hollow Line Art) -->
    <path d="M 28 44 C 35 28, 65 28, 72 44" 
          fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 38 35 C 44 25, 56 25, 62 35" 
          fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32 58 C 42 66, 58 66, 68 58" 
          fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
          
    <!-- Segment Ridges (Subtle Inner Lines) -->
    <path d="M 37 23 C 41 40, 41 60, 37 77" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 63 23 C 59 40, 59 60, 63 77" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- Delicate Hollow Star Accent -->
    <path d="M 18 20 L 20 24 L 24 24 L 21 27 L 22 31 L 18 28 L 14 31 L 15 27 L 12 24 L 16 24 Z" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
